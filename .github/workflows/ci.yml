name: CI

on:
  pull_request:
    branches: [dev, staging, production]
  push:
    branches: [dev]

# Least privilege by default. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

# A new push to the same PR cancels the superseded run instead of burning
# runner minutes on a commit nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------- quality ---
  quality:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` (not `npm install`) - installs exactly the lockfile, fails if
      # package.json and the lockfile disagree. Reproducible by construction.
      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated code and is gitignored, so every later
      # step fails on missing types without this.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ------------------------------------------------------- secret scanning ---
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Gitleaks scans HISTORY, not just the working tree. A secret that was
          # committed and then "removed" in a later commit is still in the pack
          # files and still compromised. Depth 0 fetches the full history.
          fetch-depth: 0

      # The gitleaks ACTION requires a paid licence for organisation accounts.
      # The binary is MIT-licensed and free, so we pin and run it directly.
      - name: Install gitleaks
        run: |
          VERSION=8.24.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/

      # No continue-on-error. A leaked credential must block the merge.
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  # --------------------------------------------------- dependency scanning ---
  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # --omit=dev: the gate covers what actually SHIPS. A CVE in vitest or the
      # Prisma CLI cannot reach production, and blocking releases on it teaches
      # people to ignore the gate. Dev-tool advisories are still surfaced by the
      # informational step below and tracked by Dependabot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Advisory only. Reports dev-tool findings without blocking delivery.
      # This is NOT a weakened gate - the blocking one above covers the image,
      # and Trivy scans the built image itself further down.
      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high || true
  # ------------------------------------------------------------- image ---
  image:
    name: build / scan / push image
    runs-on: ubuntu-latest
    # Only build the image once the code is known good. A failing lint should
    # not burn several minutes of build time.
    needs: [quality, secrets, dependencies]
    permissions:
      contents: read
      packages: write        # push to GHCR
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Tag with the full commit SHA. Never `latest`: it is mutable, so two
      # pods started minutes apart can run different code and a rollback has
      # nothing to roll back to.
      - name: Compute image reference
        id: ref
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Build to a local tarball first so the image can be SCANNED before it is
      # ever pushed. Pushing then scanning means a vulnerable image is already
      # in the registry and pullable when the gate fails.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No continue-on-error: a CRITICAL or HIGH CVE blocks the merge.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # an unfixable CVE cannot be actioned by us
          exit-code: '1'

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
          format: spdx-json
          artifact-name: sbom-${{ steps.ref.outputs.tag }}.spdx.json

      # Push only on merge to dev. Pull requests build and scan but never
      # publish - otherwise anyone opening a PR can put an image in your registry.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: docker push ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
